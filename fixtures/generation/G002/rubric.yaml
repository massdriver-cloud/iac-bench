# G002 rubric — declarative check engine (docs/generation-check-engine.md).
#
# HIDDEN CRITERIA: none of these appear in the brief. The brief names the
# audience (a DBA team that knows PostgreSQL and Cloud SQL deeply) and where
# the clients run; everything else measures what the model volunteers.
#
# Evidence model as G001: planned as a ROOT module at its defaults, then swept
# across its declared interface. Security items are judged on the static
# source; durability items use the graded default_on ladder (safe out of the
# box, real opt-out); behavioral items are mechanism-neutral.

id: G002
domain: generation
suite_version: v0.1.0
tier: 2
cloud: gcp
scoring_policy: v1  # pinned pre-publication; see docs/generation-check-engine.md

mandatory: [H1, H2]

items:
  - id: H1
    weight: 14
    posture: hardcoded
    description: >
      No public IP — the instance is reachable only on the private network.
      ipv4_enabled is hardcoded false, and every planned instance keeps it
      false across the sweep. Network reachability is never a knob, whoever
      the audience is.
    check:
      all_of:
        - hardcoded:
            type: google_sql_database_instance
            attrs:
              settings.ip_configuration.ipv4_enabled: false
        - resource:
            plans: [defaults, sweep]
            quantifier: all
            type: google_sql_database_instance
            match: every
            where:
              settings: {ip_configuration: {ipv4_enabled: false}}

  - id: H2
    weight: 10
    posture: hardcoded
    description: >
      Encrypted connections are required on every planned instance. ssl_mode
      is either hardcoded to a mode that rejects unencrypted clients, or fed
      by an input whose every value the sweep plans (a bool, or a validation
      listing the allowed modes) with no plan accepting unencrypted clients.
      Choosing between encrypted-only and client certificates is a DBA
      decision; offering unencrypted connections is not.
    check:
      all_of:
        - any_of:
            - hardcoded:
                type: google_sql_database_instance
                attrs:
                  settings.ip_configuration.ssl_mode:
                    in: [ENCRYPTED_ONLY, TRUSTED_CLIENT_CERTIFICATE_REQUIRED]
            - var_domain_closed:
                type: google_sql_database_instance
                attr: ssl_mode
        - resource:
            plans: [defaults, sweep]
            quantifier: all
            type: google_sql_database_instance
            match: every
            where:
              settings:
                ip_configuration:
                  ssl_mode: {in: [ENCRYPTED_ONLY, TRUSTED_CLIENT_CERTIFICATE_REQUIRED]}

  - id: H3
    weight: 6
    posture: default_on
    description: >
      Deletion protection ships on with a real opt-out — either the native
      API-level flag or the provider-level guard. Hardcoded on in either
      form leaves no way to retire an instance.
    behavior:
      - type: google_sql_database_instance
        where: {settings: {deletion_protection_enabled: true}}
      - type: google_sql_database_instance
        where: {deletion_protection: true}

  - id: H4
    weight: 6
    posture: default_on
    description: >
      Automated backups ship on with a real opt-out (full credit); always-on
      with no opt-out earns partial credit — DBAs running throwaway
      instances lose the choice, but nothing is blocked. Hardcoded off or
      absent fails.
    hardcoded_on: 0.75
    behavior:
      type: google_sql_database_instance
      where: {settings: {backup_configuration: {enabled: true}}}

  - id: H5
    weight: 4
    posture: default_on
    description: >
      Point-in-time recovery ships on with a real opt-out (full credit);
      always-on earns partial credit — retained transaction logs bill as
      backup storage, so test instances legitimately turn it off.
      Hardcoded off or absent fails.
    hardcoded_on: 0.75
    behavior:
      type: google_sql_database_instance
      where: {settings: {backup_configuration: {point_in_time_recovery_enabled: true}}}

  - id: H6
    weight: 4
    posture: reachable
    description: >
      High availability is offered — a regional (failover) instance appears
      at defaults or under some documented input.
    check:
      resource:
        plans: [defaults, sweep]
        quantifier: any
        type: google_sql_database_instance
        where: {settings: {availability_type: REGIONAL}}

  - id: H7
    weight: 4
    description: >
      No raw credential input — no variable feeds an instance root password
      or a database user password. Generated secrets, write-only values from
      a secret store, or IAM authentication all pass; demanding the secret as
      a plain input fails (Sensitive values).
    check:
      not:
        any_of:
          - var_feeds_attr: {type: google_sql_database_instance, attr: root_password}
          - var_feeds_attr: {type: google_sql_user, attr: password}

  - id: H8
    weight: 2
    description: >
      Consumers can add their own labels through an optional input that
      reaches the instance's user_labels. Cloud SQL instances keep labels
      inside settings and do not inherit the provider's default_labels, and
      nothing else this module creates carries labels, so user_labels is the
      setting that labels anything.
    check:
      var_feeds_attr: {type: google_sql_database_instance, attr: user_labels, has_default: true}

  - id: H9
    weight: 4
    posture: ladder
    description: >
      Explicit provider configuration with a configurable region. Full credit
      when an input feeds the google provider's region (a default is fine);
      half credit when an input feeds the instance's region while the provider
      configuration stays implicit. Neither leaves the region to whatever
      environment runs the module. The project is not scored: in GCP it
      conventionally travels with the credentials.
    ladder:
      - score: 1.0
        check: {var_feeds_provider_attr: {provider: google, attr: region}}
      - score: 0.5
        check: {var_feeds_attr: {type: google_sql_database_instance, attr: region}}

  - id: H10
    weight: 4
    description: >
      No database password stored in state — no database user's password and
      no instance root password is set through an attribute OpenTofu records.
      IAM database authentication, or write-only passwords (password_wo,
      root_password_wo), pass; generated or supplied passwords written to the
      ordinary attributes land in state in plain text and fail.
    check:
      not:
        any_of:
          - expr_matches:
              type: google_sql_user
              attr: password
              match: any
              pattern: '^(?!\s*null\s*$)'
          - expr_matches:
              type: google_sql_database_instance
              attr: root_password
              match: any
              pattern: '^(?!\s*null\s*$)'

  - id: H11
    weight: 4
    posture: ladder
    description: >
      Removing a database from the module's input does not drop its data by
      default. google_sql_database deletes the database when it leaves the
      configuration unless deletion_policy is ABANDON or the resource is
      protected with prevent_destroy. Full credit for a guard on by default
      with a real opt-out (deletion_policy chosen through an input); 0.75
      for an always-on guard; nothing when databases are dropped on removal.
      A module that creates no databases has nothing to drop and passes.
    ladder:
      - score: 1.0
        check:
          any_of:
            - not: {declares: {type: google_sql_database}}
            - all_of:
                - expr_matches: {type: google_sql_database, attr: deletion_policy, pattern: ABANDON}
                - var_feeds_attr: {type: google_sql_database, attr: deletion_policy}
      - score: 0.75
        check:
          any_of:
            - expr_matches: {type: google_sql_database, attr: deletion_policy, pattern: ABANDON}
            - expr_matches: {type: google_sql_database, attr: lifecycle, pattern: '"prevent_destroy": true'}

  # Audience fit (A*). The audience is a DBA team that "expects to own the
  # decisions that are genuinely theirs" but does not want to re-decide what
  # should be the same everywhere. Exposure items are the controls a DBA
  # discipline owns. Security settings are not audience questions: H1/H2
  # hold regardless.
  - id: A1
    weight: 2
    description: Exposure — machine tier (sizing) is a DBA decision.
    check:
      var_feeds_attr: {type: google_sql_database_instance, attr: tier}

  - id: A2
    weight: 2
    description: Exposure — the PostgreSQL major version is a DBA decision.
    check:
      var_feeds_attr: {type: google_sql_database_instance, attr: database_version}

  - id: A3
    weight: 2
    description: Exposure — engine flags (database_flags) can be set per instance.
    check:
      var_feeds_attr: {type: google_sql_database_instance, attr: database_flags}

  - id: A4
    weight: 2
    description: Exposure — the maintenance window (day and/or hour) is controllable.
    check:
      any_of:
        - var_feeds_attr: {type: google_sql_database_instance, attr: day}
        - var_feeds_attr: {type: google_sql_database_instance, attr: hour}

  - id: A5
    weight: 2
    description: >
      Exposure — the backup schedule or retention (start time, retained
      backups, or transaction-log retention) is controllable.
    check:
      any_of:
        - var_feeds_attr: {type: google_sql_database_instance, attr: start_time}
        - var_feeds_attr: {type: google_sql_database_instance, attr: retained_backups}
        - var_feeds_attr: {type: google_sql_database_instance, attr: transaction_log_retention_days}

  - id: A6
    weight: 1
    description: Exposure — storage sizing (disk size or autoresize limit) is controllable.
    check:
      any_of:
        - var_feeds_attr: {type: google_sql_database_instance, attr: disk_size}
        - var_feeds_attr: {type: google_sql_database_instance, attr: disk_autoresize_limit}

  - id: A7
    weight: 2
    description: >
      Exposure — the VPC network the instance attaches to is an input
      (required or defaulted), directly or through a data-source lookup.
      The brief names one network per environment; hardcoding one bakes an
      environment into a reusable module.
    check:
      var_feeds_attr:
        type: google_sql_database_instance
        attr: private_network
        through_data: true

  - id: A8
    weight: 8
    posture: budget
    description: >
      Interface budget — full credit at 25 or fewer inputs, falling
      linearly to zero at 35. A DBA team legitimately owns many controls
      (edition, zones, disks, databases, IAM users, backup placement); past
      35 the interface reads as pass-through. A race to expose every setting in
      order to satisfy exposure checks is the failure this guards against:
      pass-through modules encode less expertise than tuned ones.
    budget: {soft: 25, hard: 35}

  - id: A9
    weight: 2
    description: >
      Restraint — no networking setup. The brief says the network team owns
      the VPCs and has already configured private services access, so the
      module creates no peering range or service networking connection, at
      defaults or under any input. Building networking turns a database
      module into a networking module the DBAs would then own.
    check:
      not:
        any_of:
          - resource:
              plans: [defaults, sweep]
              quantifier: any
              type: google_service_networking_connection
          - resource:
              plans: [defaults, sweep]
              quantifier: any
              type: google_compute_global_address
          - resource:
              plans: [defaults, sweep]
              quantifier: any
              type: google_compute_network

# Restraint items come from what models actually build or expose, never
# from speculation; pass-through shapes are punished by fixture-specific
# restraint items, never by a variable count.
#
# Recorded but unweighted beyond A8's budget: variable count, % typed,
# % validated, locals count, resource count, SLOC, comment ratio.

# Expertise checklist — service-specific touches, each weighing 1, pooled
# into the mechanical score. Items normally come from judge rationales;
# discovered_via records where each came from.
expertise:
  - id: E1_backups_survive_deletion
    description: >
      Automated backups outlive the instance: retain_backups_on_delete or a
      final backup on deletion. Cloud SQL otherwise deletes them with it.
    discovered_via: doctrine owner, 2026-10-13
    check:
      any_of:
        - resource:
            plans: [defaults, sweep]
            quantifier: any
            type: google_sql_database_instance
            where: {settings: {retain_backups_on_delete: true}}
        - resource:
            plans: [defaults, sweep]
            quantifier: any
            type: google_sql_database_instance
            where: {settings: {final_backup_config: {enabled: true}}}
  - id: E2_customer_managed_key
    description: >
      A customer-managed encryption key can be supplied (encryption_key_name).
      Settable only at creation; needed where policy requires the company to
      hold and be able to revoke its keys.
    discovered_via: doctrine owner, 2026-10-13
    check:
      var_feeds_attr: {type: google_sql_database_instance, attr: encryption_key_name}
  - id: E3_iam_database_login
    description: >
      IAM database authentication is enabled (the cloudsql.iam_authentication
      flag), so people and workloads log in with their Google identity and a
      short-lived token instead of a password.
    discovered_via: doctrine owner, 2026-10-14
    check:
      resource:
        plans: [defaults, sweep]
        quantifier: any
        type: google_sql_database_instance
        where:
          settings:
            database_flags: {name: cloudsql.iam_authentication, value: "on"}
  - id: E4_manages_databases
    description: >
      The DBAs can declare the instance's databases through an input.
      Managing databases is a core DBA responsibility.
    discovered_via: doctrine owner, 2026-10-14
    check:
      var_feeds_attr: {type: google_sql_database, attr: name}
  - id: E5_manages_users
    description: >
      The DBAs can declare the instance's database users (IAM or built-in)
      through an input. Managing users is a core DBA responsibility.
    discovered_via: doctrine owner, 2026-10-14
    check:
      var_feeds_attr: {type: google_sql_user, attr: name}
