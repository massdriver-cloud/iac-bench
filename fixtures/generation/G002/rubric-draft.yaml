# G002 rubric — DRAFT. Named rubric-draft.yaml deliberately: the harness only
# recognizes rubric.yaml, so this fixture stays invisible to selftest and eval
# until (1) the check registry implements these ids, and (2) the reference
# matrix (2 good designs + bads) exists and passes selftest. Rename to
# rubric.yaml to promote.
#
# HIDDEN CRITERIA, same philosophy as G001 scoring_policy v2: the brief is a
# short human prompt; these measure volunteered SQS expertise.

id: G002
domain: generation
suite_version: v0.1.0
tier: 2
scoring_policy: v2

mandatory: [J1, J2, J3]

items:
  - id: J1
    weight: 10
    method: plan_assert
    description: >
      Dead-letter queue volunteered: a DLQ exists and the main queue has a
      redrive policy targeting it. (The brief describes the pain — lost
      messages — never the mechanism.)

  - id: J2
    weight: 8
    method: plan_assert
    description: Encryption at rest enabled on all queues (SSE-SQS or KMS), unprompted.

  - id: J3
    weight: 8
    method: no_reachability
    description: No documented input removes the DLQ/redrive or disables encryption.

  - id: J4
    weight: 6
    method: plan_assert
    description: Long polling volunteered (receive_wait_time_seconds > 0) — the
      cost/latency default experts set and beginners don't know exists.

  - id: J5
    weight: 6
    method: probe_positive
    description: Visibility timeout is a real knob — some documented input moves it
      (workers' processing time varies; a hardcoded value can't be right).

  - id: J6
    weight: 5
    method: plan_assert
    description: Redrive maxReceiveCount is a deliberate small number (2–10), not 1
      (no retry) and not absent.

  - id: J7
    weight: 5
    method: plan_assert
    description: DLQ message retention is >= the main queue's retention — dead letters
      must outlive the work that produced them to be diagnosable.

  - id: J8
    weight: 6
    method: interface
    description: Interface restraint — at most 8 inputs (hidden budget).

  - id: J9
    weight: 3
    method: static
    description: No required input exists solely to feed tags (same rule as G001 H11).

# Notes for promotion:
# - Retention itself is deletion-by-design in SQS (max 14 days, required by the
#   resource) — per the destructive-defaults doctrine's "unless required by the
#   resource" clause, forced retention is NOT a violation here, but the window
#   should still be configurable.
# - FIFO support is deliberately out of scope for the first edition; if a model
#   volunteers a fifo concept cleanly it's judge territory, not rubric.
