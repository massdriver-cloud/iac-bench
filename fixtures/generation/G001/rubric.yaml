# G001 rubric — declarative check engine (docs/generation-check-engine.md).
#
# HIDDEN CRITERIA: none of these appear in the brief. The brief is a short,
# realistic human prompt; these items measure what the model VOLUNTEERS —
# encoded S3 expertise — not compliance with stated instructions. Do not leak
# rubric content into the brief or the scaffold prompt.
#
# Evidence model: the module is planned as a ROOT module at its defaults
# (required variables only, values from the model's own minimal.tfvars), then
# swept across its declared interface. Security items (posture: hardcoded)
# are judged on the static source — a knob is the defect, even with a safe
# default. Behavioral items (posture: reachable) pass if the capability
# appears at defaults or under any perturbation — the mechanism (direct
# boolean, environment-inferred, locals-routed) is a design choice and is
# deliberately not scored.

id: G001
domain: generation
suite_version: v0.1.0
tier: 2
scoring_policy: v1  # pinned pre-publication; see docs/generation-check-engine.md

# Mandatory items are security posture. Failing one does NOT cap the score
# (scores stay true) — it is recorded as a finding, flagged in reports, and
# fails the pass/fail verdict.
mandatory: [H1, H3]

items:
  - id: H1
    weight: 18
    posture: hardcoded
    description: >
      Privacy is a property, not a knob — a public access block exists with all
      four settings hardcoded true, its existence unconditional, and every
      planned instance stays fully enabled across the entire sweep.
    check:
      all_of:
        - hardcoded:
            type: aws_s3_bucket_public_access_block
            attrs:
              block_public_acls: true
              block_public_policy: true
              ignore_public_acls: true
              restrict_public_buckets: true
        - resource:
            plans: [defaults, sweep]
            quantifier: all
            type: aws_s3_bucket_public_access_block
            match: every
            where:
              block_public_acls: true
              block_public_policy: true
              ignore_public_acls: true
              restrict_public_buckets: true

  - id: H3
    weight: 14
    posture: hardcoded
    description: >
      Encryption at rest is a property, not a knob — configured unconditionally
      in the source (dedicated resource or inline), present in every reachable
      plan. Which algorithm is a design choice; whether to encrypt is not.
    check:
      all_of:
        - any_of:
            - hardcoded:
                type: aws_s3_bucket_server_side_encryption_configuration
            - hardcoded:
                type: aws_s3_bucket
                attrs_exist: [server_side_encryption_configuration]
        - any_of:
            - resource:
                plans: [defaults, sweep]
                quantifier: all
                type: aws_s3_bucket_server_side_encryption_configuration
            - resource:
                plans: [defaults, sweep]
                quantifier: all
                type: aws_s3_bucket
                match: every
                where:
                  server_side_encryption_configuration: {exists: true}

  - id: H6
    weight: 6
    posture: reachable
    description: >
      Lifecycle cost management volunteered — transition and/or expiration
      rules appear at defaults or under some documented input.
    check:
      any_of:
        - resource:
            plans: [defaults, sweep]
            quantifier: any
            type: aws_s3_bucket_lifecycle_configuration
            where: {rule: {transition: {exists: true}}}
        - resource:
            plans: [defaults, sweep]
            quantifier: any
            type: aws_s3_bucket_lifecycle_configuration
            where: {rule: {expiration: {exists: true}}}
        - resource:
            plans: [defaults, sweep]
            quantifier: any
            type: aws_s3_bucket_lifecycle_configuration
            where: {rule: {noncurrent_version_expiration: {exists: true}}}
        - resource:
            plans: [defaults, sweep]
            quantifier: any
            type: aws_s3_bucket_lifecycle_configuration
            where: {rule: {noncurrent_version_transition: {exists: true}}}

  - id: H7
    weight: 4
    posture: reachable
    description: >
      Storage hygiene beyond the obvious — noncurrent-version handling or
      incomplete-multipart-upload cleanup.
    check:
      any_of:
        - resource:
            plans: [defaults, sweep]
            quantifier: any
            type: aws_s3_bucket_lifecycle_configuration
            where: {rule: {noncurrent_version_expiration: {exists: true}}}
        - resource:
            plans: [defaults, sweep]
            quantifier: any
            type: aws_s3_bucket_lifecycle_configuration
            where: {rule: {noncurrent_version_transition: {exists: true}}}
        - resource:
            plans: [defaults, sweep]
            quantifier: any
            type: aws_s3_bucket_lifecycle_configuration
            where: {rule: {abort_incomplete_multipart_upload: {exists: true}}}

  - id: H8
    weight: 5
    posture: reachable
    description: Versioning offered — enabled at defaults or under some input.
    check:
      resource:
        plans: [defaults, sweep]
        quantifier: any
        type: aws_s3_bucket_versioning
        where: {versioning_configuration: {status: "Enabled"}}

  - id: H9
    weight: 4
    posture: reachable
    description: >
      Server access logging offered — the mechanism (direct toggle or inferred
      from a generalized setting) is a design choice and not scored.
    check:
      resource:
        plans: [defaults, sweep]
        quantifier: any
        type: aws_s3_bucket_logging

  - id: H10
    weight: 6
    description: >
      Interface restraint — at most 8 inputs. The brief only implies this
      ("a couple of obvious inputs"); the budget itself is hidden.
    check:
      interface: {max_variables: 8}

  - id: H12
    weight: 2
    description: >
      Tagging support is table stakes — consumers can add their own tags
      through an optional input. (Demanding a required input for tags is
      scope invention, judged under Unstated assumptions.)
    check:
      var_feeds_attr: {attr: tags, has_default: true}

  - id: H13
    weight: 4
    description: >
      Access logging actually works: the log destination grants the logging
      service permission to deliver. Checked in source, not plan JSON —
      ARN-interpolating policies are unknown at plan time.
    check:
      source_contains: "logging.s3.amazonaws.com"

  - id: H14
    weight: 3
    description: >
      force_destroy is accessible (per Destructive defaults) — some documented
      input influences it, directly or inferred from a concept such as
      environment. Hardcoded either way, or absent entirely, leaves the
      consumer no way out.
    check:
      var_feeds_attr: {attr: force_destroy}


# Input guarding (are the *right* variables validated) is deliberately NOT a
# mechanical item — with no stated org policies there is no ground truth for
# correct bounds. It is judged in layer 3.
# Recorded but unweighted: variable count, % typed, % validated, locals count,
# resource count, SLOC, comment ratio.

# Expertise checklist — discovered service-specific touches, mechanically
# verified. Each item carries weight 1 (unless overridden) in the pooled
# mechanical score, so rubric items dominate by construction and growing the
# checklist cannot swamp the core rubric. Also reported as its own differential
# table. Grows by discovery: judge rationales cite differentiators, approved
# ones become permanent items. Qualification rule: an item must not
# invent an uncommunicated use-case or demand new inputs.
expertise:
  - id: E1_ownership_controls
    description: BucketOwnerEnforced ownership controls (ACLs disabled).
    discovered_via: judge rationale, 2026-08-18 (opus-5 judging sonnet-5 vs refs)
    check:
      resource:
        plans: [defaults, sweep]
        quantifier: any
        type: aws_s3_bucket_ownership_controls
        where: {rule: {object_ownership: "BucketOwnerEnforced"}}
  - id: E2_multipart_cleanup
    description: Aborts incomplete multipart uploads (storage garbage collection).
    discovered_via: judge rationale, 2026-08-18
    check:
      resource:
        plans: [defaults, sweep]
        quantifier: any
        type: aws_s3_bucket_lifecycle_configuration
        where: {rule: {abort_incomplete_multipart_upload: {exists: true}}}
  - id: E4_tls_enforcement
    description: Bucket policy denies non-TLS (aws:SecureTransport) access.
    discovered_via: judge rationale, 2026-08-18
    check:
      source_contains: "aws:SecureTransport"
  - id: E5_regional_domain_output
    description: Outputs bucket_regional_domain_name for downstream wiring.
    discovered_via: judge rationale, 2026-08-18
    check:
      output_named: {value_contains: bucket_regional_domain_name}
  - id: E6_intelligent_tiering
    description: Uses or offers Intelligent-Tiering storage class awareness.
    discovered_via: judge rationale, 2026-08-18
    check:
      any_of:
        - resource:
            plans: [defaults, sweep]
            quantifier: any
            type: aws_s3_bucket_intelligent_tiering_configuration
        - resource:
            plans: [defaults, sweep]
            quantifier: any
            type: aws_s3_bucket_lifecycle_configuration
            where: {rule: {transition: {storage_class: "INTELLIGENT_TIERING"}}}
  - id: E7_name_uniqueness
    description: >
      Bucket names include a uniqueness mechanism (random suffix, account id)
      seen through locals, or delegate to bucket_prefix — S3's namespace is
      global. Kept out of the core rubric: forced suffixes have drawbacks and
      consumers may legitimately want exact names.
    discovered_via: owner review, 2026-08-21
    check:
      expr_matches:
        type: aws_s3_bucket
        attr: bucket
        pattern: 'random_(id|string|pet|uuid|integer)\.|aws_caller_identity\.'
        or_attr_present: bucket_prefix
  - id: E8_custom_kms_key
    description: >
      Consumers can supply their own KMS key for encryption — as an optional
      reference, never a raw secret.
    discovered_via: owner review, 2026-08-21
    check:
      var_feeds_attr: {attr: kms_master_key_id, has_default: true}
