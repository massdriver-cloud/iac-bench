# G003 rubric — declarative check engine (docs/generation-check-engine.md).
#
# HIDDEN CRITERIA: none of these appear in the brief. The brief names the
# audience (an SRE team that knows Azure and thinks in capacity,
# availability, health, rollouts, and observability, but won't hand-tune App
# Service internals).
#
# Deployment slots are full, publicly reachable apps: whenever one is
# planned, it is held to the same HTTPS, publishing and transport posture as
# the production app.
#
# Provider defaults matter here: azurerm ships https_only = false and both
# basic-auth publishing paths ON, so those items require the module to
# change them. TLS 1.2, FTPS disabled, and remote debugging off are already
# the defaults, so those items require only that the module never weakens
# them or exposes them as knobs.

id: G003
domain: generation
suite_version: v0.1.0
tier: 2
cloud: azure
scoring_policy: v1  # pinned pre-publication; see docs/generation-check-engine.md

mandatory: [H1, H2]

# Provider-valid values the solver tries for inputs that feed these
# attributes directly (docs/generation-check-engine.md, solve-then-confirm).
samples:
  azurerm_monitor_diagnostic_setting.log_analytics_workspace_id: &law /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/rg-iacbench/providers/Microsoft.OperationalInsights/workspaces/law-iacbench
  azurerm_application_insights.workspace_id: *law

items:
  - id: H1
    weight: 10
    posture: hardcoded
    description: >
      HTTPS only — plain-HTTP requests are redirected, hardcoded on every
      web app and deployment slot and present across the sweep. The provider
      default is off.
    check:
      all_of:
        - hardcoded:
            type: azurerm_linux_web_app
            attrs: {https_only: true}
        - resource:
            plans: [defaults, sweep]
            quantifier: all
            type: azurerm_linux_web_app
            match: every
            where: {https_only: true}
        - resource:
            plans: [defaults, sweep]
            quantifier: all
            type: azurerm_linux_web_app_slot
            match: every
            if_present: true
            where: {https_only: true}
        - not:
            var_feeds_attr: {type: azurerm_linux_web_app_slot, attr: https_only}

  - id: H2
    weight: 8
    posture: hardcoded
    description: >
      Basic-auth publishing is disabled on every web app and deployment
      slot — neither FTP nor Web Deploy accepts the shared publishing
      credentials. Both default to ON in the provider.
    check:
      all_of:
        - hardcoded:
            type: azurerm_linux_web_app
            attrs:
              ftp_publish_basic_authentication_enabled: false
              webdeploy_publish_basic_authentication_enabled: false
        - resource:
            plans: [defaults, sweep]
            quantifier: all
            type: azurerm_linux_web_app
            match: every
            where:
              ftp_publish_basic_authentication_enabled: false
              webdeploy_publish_basic_authentication_enabled: false
        - resource:
            plans: [defaults, sweep]
            quantifier: all
            type: azurerm_linux_web_app_slot
            match: every
            if_present: true
            where:
              ftp_publish_basic_authentication_enabled: false
              webdeploy_publish_basic_authentication_enabled: false
        - not:
            any_of:
              - var_feeds_attr: {type: azurerm_linux_web_app_slot, attr: ftp_publish_basic_authentication_enabled}
              - var_feeds_attr: {type: azurerm_linux_web_app_slot, attr: webdeploy_publish_basic_authentication_enabled}

  - id: H3
    weight: 6
    description: >
      Transport stays strong — TLS for the site and the deployment (SCM)
      endpoint is 1.2 or newer, FTP is disabled or FTPS-only, and remote
      debugging is off, on every planned app and deployment slot, and none
      of these is fed by an input.
    check:
      all_of:
        - resource:
            plans: [defaults, sweep]
            quantifier: all
            type: azurerm_linux_web_app
            match: every
            where:
              site_config:
                minimum_tls_version: {in: ["1.2", "1.3"]}
                scm_minimum_tls_version: {in: ["1.2", "1.3"]}
                ftps_state: {in: [Disabled, FtpsOnly]}
                remote_debugging_enabled: false
        - resource:
            plans: [defaults, sweep]
            quantifier: all
            type: azurerm_linux_web_app_slot
            match: every
            if_present: true
            where:
              site_config:
                minimum_tls_version: {in: ["1.2", "1.3"]}
                scm_minimum_tls_version: {in: ["1.2", "1.3"]}
                ftps_state: {in: [Disabled, FtpsOnly]}
                remote_debugging_enabled: false
        - not:
            any_of:
              - var_feeds_attr: {type: azurerm_linux_web_app, attr: minimum_tls_version}
              - var_feeds_attr: {type: azurerm_linux_web_app, attr: scm_minimum_tls_version}
              - var_feeds_attr: {type: azurerm_linux_web_app, attr: ftps_state}
              - var_feeds_attr: {type: azurerm_linux_web_app, attr: remote_debugging_enabled}
              - var_feeds_attr: {type: azurerm_linux_web_app_slot, attr: minimum_tls_version}
              - var_feeds_attr: {type: azurerm_linux_web_app_slot, attr: scm_minimum_tls_version}
              - var_feeds_attr: {type: azurerm_linux_web_app_slot, attr: ftps_state}
              - var_feeds_attr: {type: azurerm_linux_web_app_slot, attr: remote_debugging_enabled}

  - id: H4
    weight: 4
    posture: hardcoded
    description: >
      A managed identity is attached unconditionally, so the app can reach
      other Azure services without stored credentials.
    check:
      hardcoded:
        type: azurerm_linux_web_app
        attrs_exist: [identity]

  - id: H5
    weight: 4
    posture: reachable
    description: >
      Health checks are offered — a health-check path is configured at
      defaults or under some documented input, so unhealthy instances are
      taken out of rotation.
    check:
      resource:
        plans: [defaults, sweep]
        quantifier: any
        type: azurerm_linux_web_app
        where: {site_config: {health_check_path: {nonempty: true}}}

  - id: H6
    weight: 4
    posture: reachable
    description: >
      Observability is offered — diagnostic settings or Application Insights
      appear at defaults or under some documented input.
    check:
      any_of:
        - resource:
            plans: [defaults, sweep]
            quantifier: any
            type: azurerm_monitor_diagnostic_setting
        - resource:
            plans: [defaults, sweep]
            quantifier: any
            type: azurerm_application_insights

  - id: H7
    weight: 3
    posture: reachable
    description: >
      Redundancy is offered — zone balancing on the service plan appears at
      defaults or under some documented input, including inputs the module
      requires together (zone balancing with enough instances).
    check:
      resource:
        plans: [defaults, sweep]
        quantifier: any
        type: azurerm_service_plan
        where: {zone_balancing_enabled: true}

  - id: H9
    weight: 4
    posture: reachable
    description: >
      Rollouts are offered — a deployment slot (azurerm_linux_web_app_slot)
      is declared, at defaults or behind an input, so a release can be
      staged, warmed and swapped into production instead of replacing the
      running app in place.
    check:
      declares: {type: azurerm_linux_web_app_slot}

  - id: H8
    weight: 2
    description: >
      Tagging support is table stakes — consumers can add their own tags to
      the web app through an optional input.
    check:
      var_feeds_attr: {type: azurerm_linux_web_app, attr: tags, has_default: true}

  # Audience fit (A*). SREs own capacity, health, rollouts, and what runs;
  # they explicitly don't want to hand-tune App Service internals.
  - id: A1
    weight: 2
    description: Exposure — the plan size (SKU) is an SRE capacity decision.
    check:
      var_feeds_attr: {type: azurerm_service_plan, attr: sku_name}

  - id: A2
    weight: 2
    description: >
      Exposure — instance count or autoscale bounds are controllable.
    check:
      any_of:
        - var_feeds_attr: {type: azurerm_service_plan, attr: worker_count}
        - var_feeds_attr: {type: azurerm_monitor_autoscale_setting, attr: minimum}
        - var_feeds_attr: {type: azurerm_monitor_autoscale_setting, attr: maximum}

  - id: A3
    weight: 2
    description: Exposure — the health-check path is set per service.
    check:
      var_feeds_attr: {type: azurerm_linux_web_app, attr: health_check_path}

  - id: A4
    weight: 2
    description: Exposure — which container image runs is set per service.
    check:
      var_feeds_attr: {type: azurerm_linux_web_app, attr: docker_image_name}

  - id: A5
    weight: 2
    description: Exposure — application settings (environment) can be supplied.
    check:
      var_feeds_attr: {type: azurerm_linux_web_app, attr: app_settings}

  - id: A6
    weight: 2
    description: >
      Restraint — no input for App Service worker internals (32-bit worker,
      HTTP/2, load-balancing mode, in-app MySQL). The brief's audience
      explicitly doesn't want to hand-tune these.
    check:
      not:
        any_of:
          - var_feeds_attr: {type: azurerm_linux_web_app, attr: use_32_bit_worker}
          - var_feeds_attr: {type: azurerm_linux_web_app, attr: http2_enabled}
          - var_feeds_attr: {type: azurerm_linux_web_app, attr: load_balancing_mode}
          - var_feeds_attr: {type: azurerm_linux_web_app, attr: local_mysql_enabled}

  - id: A7
    weight: 8
    posture: budget
    description: >
      Interface budget — full credit at 20 or fewer inputs, falling
      linearly to zero at 30. An SRE team owns capacity, availability,
      health, rollout, and observability controls. A race to expose every setting in
      order to satisfy exposure checks is the failure this guards against:
      pass-through modules encode less expertise than tuned ones.
    budget: {soft: 20, hard: 30}

# Recorded but unweighted beyond A7's budget: variable count, % typed,
# % validated, locals count, resource count, SLOC, comment ratio.
#
# Not an item: the deprecated azurerm_app_service / azurerm_app_service_plan
# resources were removed in azurerm 4.x, so a module using them fails the
# plan gate on its own.

# Expertise checklist — grows by discovery from judge rationales. Candidates
# to watch for (not yet items): health-check eviction time, a staging slot,
# ACR pull via managed identity, always_on, Key Vault references for app
# settings, SCM IP restriction parity, client affinity off for stateless APIs.
expertise:
  - id: E1_autoscale_rules
    description: >
      Capacity follows load: an autoscale setting scales the plan between
      bounds instead of a fixed instance count.
    discovered_via: doctrine owner, 2026-10-21
    check:
      declares: {type: azurerm_monitor_autoscale_setting}
  - id: E2_container_port
    description: >
      The container's listening port reaches App Service (WEBSITES_PORT), so
      images that don't listen on port 80 receive traffic and pass health
      checks.
    discovered_via: doctrine owner, 2026-10-21
    check:
      source_contains: WEBSITES_PORT
  - id: E3_metric_alerts
    description: >
      Metric alerts are defined (for example 5xx rate, response time or
      health-check status), so the SREs are paged on symptoms rather than
      discovering them in dashboards.
    discovered_via: doctrine owner, 2026-10-21
    check:
      declares: {type: azurerm_monitor_metric_alert}
  - id: E4_registry_pull_identity
    description: >
      Images are pulled from the container registry with the app's managed
      identity (container_registry_use_managed_identity), so no registry
      password is stored in app settings.
    discovered_via: doctrine owner, 2026-10-21
    check:
      any_of:
        - resource:
            plans: [defaults, sweep]
            quantifier: any
            type: azurerm_linux_web_app
            where: {site_config: {container_registry_use_managed_identity: true}}
        - var_feeds_attr: {type: azurerm_linux_web_app, attr: container_registry_use_managed_identity}
  - id: E5_key_vault_references
    description: >
      Secrets reach the app as Key Vault references in app settings
      (@Microsoft.KeyVault(...)), resolved by the managed identity, so secret
      values never sit in app settings or state.
    discovered_via: doctrine owner, 2026-10-21
    check:
      source_contains: "@Microsoft.KeyVault"
