id: F101
domain: apply_failure
suite_version: v0.1.0
visibility: public
tier: 2
error_class: malformed_policy
error_pattern: "MalformedPolicy"
description: >
  An S3 bucket gets a randomized name suffix, but the bucket policy's Resource
  ARN is hardcoded to the un-suffixed name — a classic "hardcoded ARN drifted
  from the actual resource" bug. Apply creates the bucket, then fails putting
  the policy with MalformedPolicy (policy resource does not match the bucket).
  The fix must derive the ARN from the bucket resource, keeping both the
  bucket and the policy.

seed_params:
  resource_prefix: ["app", "svc", "worker", "edge"]

required_addresses:
  - "aws_s3_bucket.{{ resource_prefix }}_assets"
  - "aws_s3_bucket_policy.{{ resource_prefix }}_assets"

forbidden_file_edits:
  - ".terraform.lock.hcl"
  - ".tofu-version"
  - "**/*.json"

removable_addresses: []
min_resource_count: 3
