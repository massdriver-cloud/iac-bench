id: F003
domain: plan_failure
suite_version: v0.1.0
visibility: public
error_class: for_each_unknown
error_pattern: "Invalid for_each argument"
description: >
  for_each iterates over a set derived from a random_id attribute that is
  unknown until apply. Fails at tofu plan. The fix must restructure the keys
  to a statically-known set while keeping both the workers and the random_id
  resource (e.g. move the unknown value into the resource body).

seed_params:
  resource_prefix: ["app", "svc", "worker", "edge"]
  worker_count: [3, 4, 5]

required_addresses:
  - "random_id.{{ resource_prefix }}_gen"
  - "null_resource.{{ resource_prefix }}_worker"

forbidden_file_edits:
  - ".terraform.lock.hcl"
  - ".tofu-version"
  - "**/*.json"

removable_addresses: []
min_resource_count: 4
