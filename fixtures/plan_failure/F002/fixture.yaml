id: F002
domain: plan_failure
suite_version: v0.1.0
visibility: public
error_class: type_mismatch
error_pattern: "Invalid default value for variable"
description: >
  A variable declared map(string) has a list(string) default and is consumed
  by a for_each. Fails at tofu validate. The fix must keep the resource and
  its for_each semantics intact (either fix the default to a map, or change
  the type and consumption coherently).

seed_params:
  resource_prefix: ["app", "svc", "worker", "edge"]
  env_name: ["dev", "staging", "prod"]

required_addresses:
  - "null_resource.{{ resource_prefix }}_node"

forbidden_file_edits:
  - ".terraform.lock.hcl"
  - ".tofu-version"
  - "**/*.json"

removable_addresses: []
min_resource_count: 3
