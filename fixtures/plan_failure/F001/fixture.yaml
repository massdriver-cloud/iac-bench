id: F001
domain: plan_failure
suite_version: v0.1.0
visibility: public
error_class: cycle
error_pattern: "Cycle"
description: >
  Two null_resources reference each other's id in triggers, producing a
  dependency cycle. The fix must break the cycle while preserving both
  resources and a data dependency between them.

seed_params:
  resource_prefix: ["app", "svc", "worker", "edge"]
  extra_decoys: [0, 1, 2]

required_addresses:
  - "null_resource.{{ resource_prefix }}_a"
  - "null_resource.{{ resource_prefix }}_b"

forbidden_file_edits:
  - ".terraform.lock.hcl"
  - ".tofu-version"
  - "**/*.json"

removable_addresses: []
min_resource_count: 2
