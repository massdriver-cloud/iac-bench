[project]
name = "iacbench"
version = "0.1.0"
description = "Benchmark scoring LLMs on OpenTofu infrastructure-as-code tasks with mechanical invariants"
license = "Apache-2.0"
requires-python = ">=3.10"
dependencies = [
    "anthropic>=0.122.0",
    "boto3>=1.34",
    "google-genai>=1.0",
    "inspect-ai>=0.3.90",
    "jinja2>=3.1",
    "python-hcl2>=4.3",
    "openai>=3.0.0",
    "pyyaml>=6.0",
]

[project.scripts]
iacbench = "iacbench.cli:main"

[dependency-groups]
dev = ["ruff>=0.6"]

[tool.ruff.lint]
# Real-error rules on; pedantic perf/style families deliberately excluded.
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]
ignore = ["B904"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/iacbench"]
