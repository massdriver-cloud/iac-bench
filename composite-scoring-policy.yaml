# Composite grading policy (versioned — recorded into reports; changing it
# re-grades all stored results for free).
#
# composite = 100 * (w_mechanical * mechanical + w_grade * grade/100)
#
# mechanical pools the rubric and expertise checklists into one weighted
# fraction: rubric items carry their rubric weights (2-18), expertise items
# weigh 1 each unless overridden — so the rubric dominates by construction
# and the per-item worth of an expertise entry does not balloon when the
# rubric grows or shrink when the checklist grows.
#
# NO score caps anywhere — scores are true values. Mandatory-item failures
# (security) are tracked as FINDINGS: reported in their own section, flagged
# on scored rows, and they fail the verdict — but they do not distort the
# numeric score. The judge grade enters only while its stored calibration
# status is "calibrated"; otherwise the composite is mechanical-only.
policy_version: v1  # pinned pre-publication
weights:
  mechanical: 0.70  # pooled rubric + expertise
  grade: 0.30       # absolute judge grade vs good-opentofu.md, /100
