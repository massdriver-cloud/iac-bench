# Generation reference matrix (docs/generation-check-engine.md). Bad
# references are asserted by WHICH items fail, with score bounds as sanity
# checks on true, uncapped values.
#
# Engine coverage: H1 exercises the matches predicate on a planned location;
# H14 the in predicate on a version input's default (bad_pinned_version) and
# the exists predicate on unset versions; H5 a negative-lookahead matches on a
# service account email known at plan; A2 through_data (ref_standard looks
# its subnet up by environment and region).
ref_standard:
  gate: true
  min_score: 0.99
  must_pass: [H1, H2, H3, H4, H5, H6, H7, H8, H9, H10, H11, H12, H13, H14, H15, H16,
              A1, A2, A3, A4, A5, A6, A7, B1_provider_constraints, B2_descriptions,
              E1_release_channel, E2_google_groups_rbac,
              E3_vulnerability_scanning, E4_cost_allocation, E5_surge_upgrades,
              E6_apiserver_logs, E7_managed_prometheus,
              E8_dns_endpoint, E9_node_sa_minimal_role, E10_release_channel_input, B3_plans_required_only]
ref_lean:
  # A different good design: network and subnet names as inputs, one node
  # pool, ten inputs. Private nodes on the pool (network_config), the IP
  # endpoints off in favour of the DNS endpoint, no default pool ever created
  # (initial_node_count 0), Calico network policy, blue-green upgrades, labels
  # through resource_labels, and the individual minimal node roles. Its key
  # input names the KMS grant instead of making it. No Google Groups RBAC,
  # Binary Authorization, security posture, cost allocation, API server logs,
  # managed Prometheus or Backup for GKE. Applied 2026-11-20.
  gate: true
  min_score: 0.99
  must_pass: [H1, H2, H3, H4, H5, H6, H7, H8, H9, H10, H11, H12, H13, H14, H15, H16,
              A1, A2, A3, A4, A5, A6, A7, B1_provider_constraints, B2_descriptions,
              B3_plans_required_only, E1_release_channel, E5_surge_upgrades,
              E8_dns_endpoint, E9_node_sa_minimal_role]
  must_fail: [E10_release_channel_input, E2_google_groups_rbac, E3_vulnerability_scanning,
              E4_cost_allocation, E6_apiserver_logs, E7_managed_prometheus]
bad_no_pool_stable:
  # ref_lean on the STABLE channel: no default pool below Kubernetes 1.36,
  # which GKE rejects at create (F1, verified 2026-11-20) although the plan
  # succeeds. Scored in full, then multiplied by 0.5.
  gate: true
  apply_failures: [F1_no_default_pool_below_1_36]
  max_score: 0.5
  must_pass: [H6, E1_release_channel]
bad_autopilot:
  # An Autopilot cluster where the brief asks for Standard: private,
  # regional and deletion-protected, but no node pools or explicit Workload
  # Identity, Dataplane V2 or secure boot.
  gate: true
  must_pass: [H1, H2, H3, H11, H15]
  must_fail: [H4, H5, H6, H8, H10, H13, A3]
bad_zonal:
  # A single zone, and a fixed control-plane range every cluster would share.
  gate: true
  must_fail: [H1, H16]
bad_default_sa:
  gate: true
  must_fail: [H4, H5]
bad_public:
  gate: true
  must_fail: [H2, H3, E8_dns_endpoint]
bad_pinned_version:
  gate: true
  must_fail: [H14, E1_release_channel]
bad_minimal:
  gate: true
  max_score: 0.4
  must_fail: [H1, H2, H3, H4, H5, H6, H7, H8, H9, H10, H13, H15, A6]
  items: {H11: 0.0}
bad_owned_key_no_grant:
  # Encrypts Secrets at defaults with a key the module creates, but never
  # grants the GKE service agent use of it: GKE rejects the create (verified
  # 2026-11-18 with a key lacking the grant).
  gate: true
  must_pass: [H1, H2, H4, H5]
  must_fail: [H9]
ok_owned_key:
  # bad_owned_key_no_grant with the grant to the GKE service agent.
  gate: true
  must_pass: [H1, H2, H4, H5, H9]
ok_placeholder_project:
  # A required project input with a made-up ID that a data lookup reads:
  # scoring substitutes the sandbox project, so the module plans and scores
  # as ref_standard does.
  gate: true
  min_score: 0.99
  must_pass: [H1, H2, H4, H5, A2, B3_plans_required_only]
bad_optional_default:
  # An optional input whose default fails its own validation; minimal.tfvars
  # sets it. Scored from the plan with every tfvars value; only B3 fails.
  gate: true
  must_pass: [H1, H2, H3, H4, H5, H9]
  must_fail: [B3_plans_required_only]
