# Generation reference matrix under the declarative check engine
# (docs/generation-check-engine.md). No score caps: mandatory failures are
# findings, not score ceilings — the bad references are asserted by WHICH
# items fail, with score bounds as sanity checks on true, uncapped values.
#
# Ids after the posture merges: H1 = privacy (former H1+H2), H3 = encryption
# (former H3+H4). H2/H4 no longer exist.
ref_lean:
  gate: true
  min_score: 0.95
  must_pass: [H1, H3, H5, H11, H12, H13]
ref_flexible:
  gate: true
  min_score: 0.95
  must_pass: [H1, H3, H5, H11, H12, H13]
bad_passthrough:
  gate: true
  # Variablized PAB and count-gated encryption fail the hardcoded posture
  # outright; versioning now passes as reachable (enable_versioning flips it).
  max_score: 0.35
  must_fail: [H1, H3, H7, H9, H10, H11]
bad_minimal:
  gate: true
  max_score: 0.15
  must_fail: [H1, H3, H5, H6, H13]
bad_unsafe:
  gate: true
  # True score stays high — its ONE critical defect (public_read feeds the
  # public access block, so privacy is a knob) fails merged H1, which now
  # carries the full former H1+H2 weight. Uncapped-score philosophy in
  # miniature: the finding fails the verdict, the number stays true.
  max_score: 0.75
  must_fail: [H1, H13]
