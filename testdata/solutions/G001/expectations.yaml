# Generation reference matrix under scoring_policy v2 rubric + v3 grading
# (no score caps: mandatory failures are findings, not score ceilings — so the
# bad references are asserted by WHICH items fail, with score bounds as sanity
# checks on true, uncapped values).
ref_lean:
  gate: true
  min_score: 0.95
  must_pass: [H1, H2, H3, H4, H11, H12, H13]
ref_flexible:
  gate: true
  min_score: 0.95
  must_pass: [H1, H2, H3, H4, H11, H12, H13]
bad_passthrough:
  gate: true
  max_score: 0.6
  must_fail: [H2, H4, H7, H9, H10, H11]
bad_minimal:
  gate: true
  max_score: 0.3
  must_fail: [H1, H3, H5, H6, H13]
bad_unsafe:
  gate: true
  # True score is high — its ONE defect is critical (consumer can open the
  # bucket). The must_fail on mandatory H2 is what marks it failing; this is
  # the uncapped-score philosophy in miniature.
  max_score: 0.9
  must_fail: [H2, H13]
