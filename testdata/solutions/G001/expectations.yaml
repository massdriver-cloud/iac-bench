# Generation reference matrix (docs/generation-check-engine.md). No score
# caps: mandatory failures are findings, not score ceilings — the bad
# references are asserted by WHICH items fail, with score bounds as sanity
# checks on true, uncapped values. bad_minimal's >= 5.0, < 7.0 window
# spans two majors and fails B1's tight-bound rule.
ref_lean:
  gate: true
  min_score: 0.95
  must_pass: [H1, H3, H12, H13, H14, H15, A1, A2, A3, A4, A5, B1_provider_constraints, B2_descriptions]
ref_flexible:
  gate: true
  min_score: 0.95
  must_pass: [H1, H3, H12, H13, H14, H15, A1, A2, A3, A4, A5, B1_provider_constraints, B2_descriptions]
bad_passthrough:
  gate: true
  # Variablized public-access-block attributes and count-gated encryption fail
  # the hardcoded posture; versioning passes as reachable (enable_versioning
  # surfaces it in the sweep); its unbounded random provider fails B1 and
  # its undescribed variables fail B2. Its optional tags input is applied
  # resource by resource, not through default_tags: half credit on H12. Exposing the encryption algorithm
  # Choosing the algorithm through an input is allowed; it demands no key,
  # so A2 passes, and A3/A4 restraint it never violates pass too. Its 14
  # inputs leave 25% of the A5 budget.
  max_score: 0.31
  must_fail: [H1, H3, H7, H9, H15, A5, B1_provider_constraints, B2_descriptions]
  items: {A5: 0.25, H12: 0.5}
bad_minimal:
  gate: true
  max_score: 0.20
  must_fail: [H1, H3, H6, H12, H13, H14, H15, B1_provider_constraints, B2_descriptions]
bad_unsafe:
  gate: true
  # True score stays high — its ONE critical defect (public_read feeds the
  # public access block, so privacy is a knob) fails H1. Uncapped-score
  # philosophy in miniature: the finding fails the verdict, the number stays
  # true.
  max_score: 0.70
  must_fail: [H1, H13, H15]
