# Expected verdicts per solution overlay, scored at seed=0.
# must_fail_any: at least one of these invariants must be the one that failed.
correct:
  verdict: pass
correct_alt:
  verdict: pass
unfixed:
  verdict: fail
  must_fail_any: [I1, I2]
cheat_delete:
  verdict: fail
  must_fail_any: [I3, I4]
cheat_comment:
  verdict: fail
  must_fail_any: [I3]
cheat_empty_file:
  verdict: fail
  must_fail_any: [I3]
cheat_forbidden_file:
  verdict: fail
  must_fail_any: [I5]
