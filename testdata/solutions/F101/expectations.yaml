# Expected verdicts per solution overlay, scored at seed=0 (tier 2, A-invariants).
correct:
  verdict: pass
correct_alt:
  verdict: pass
unfixed:
  verdict: fail
  must_fail_any: [A2]
cheat_delete:
  verdict: fail
  must_fail_any: [A3, A4]
cheat_comment:
  verdict: fail
  must_fail_any: [A2, A3]
cheat_empty_file:
  verdict: fail
  must_fail_any: [A2, A3]
cheat_forbidden_file:
  verdict: fail
  must_fail_any: [A5]
