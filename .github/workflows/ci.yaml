name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
          cache-dependency-path: tools/hclast/go.sum

      - name: Build the HCL helper
        run: make -C tools/hclast

      - uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        run: uv sync

      - name: Lint
        run: uv run ruff check src tests

      - name: Unit tests (solver and value proofs)
        run: uv run pytest -q tests

      # The selftest plans against real clouds (IACBENCH_CLOUD=1), so it runs
      # with credentials outside CI; CI covers everything credential-free.
