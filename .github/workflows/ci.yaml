name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-and-selftest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: latest

      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
          cache-dependency-path: tools/hclast/go.sum

      - name: Build the HCL helper
        run: make -C tools/hclast

      - uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        run: uv sync

      - name: Lint
        run: uv run ruff check src tests

      - name: Unit tests (static analysis: solver and value proofs)
        run: uv run pytest -q tests

      - name: Selftest (hermetic tier)
        # Validates every checker against the known-answer solution matrices.
        # Tier-2 (IACBENCH_AWS=1) and generation (IACBENCH_CLOUD=1) fixtures are skipped
        # — CI runs only credential-free, deterministic scoring validation.
        env:
          TF_PLUGIN_CACHE_DIR: ${{ github.workspace }}/.cache/providers
        run: |
          mkdir -p .cache/providers
          uv run iacbench selftest
